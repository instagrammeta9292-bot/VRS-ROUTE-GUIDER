<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>VRS Route Guider</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#ffffff;
    color:#000000;
    font-family:"Inter",sans-serif;
    overflow-x:hidden;
}

/* HEADER */

.header{
    width:100%;
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:#ffffff;

    border-bottom:1px solid #ededed;

    position:relative;
    z-index:20;
}

.header-btn{
    width:40px;
    height:40px;

    border:0;
    border-radius:12px;

    background:#f5f5f5;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.header-btn svg{
    width:20px;
    height:20px;
}

.header-btn path{
    fill:none;
    stroke:#000000;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.header-title{
    position:absolute;

    left:50%;

    transform:translateX(-50%);

    font-size:15px;
    font-weight:800;

    letter-spacing:.8px;

    white-space:nowrap;
}

/* MAIN */

.main{
    width:100%;
    max-width:700px;

    min-height:calc(100vh - 140px);

    margin:auto;

    padding:35px 18px 130px;

    display:flex;
    flex-direction:column;
}

/* HERO */

.hero{
    padding-top:20px;

    text-align:center;
}

.hero-small{
    font-size:10px;

    font-weight:700;

    letter-spacing:2px;

    color:#999999;

    text-transform:uppercase;
}

.hero-title{
    margin-top:10px;

    font-size:31px;

    line-height:1.15;

    font-weight:800;

    letter-spacing:-1.2px;
}

.hero-description{
    max-width:330px;

    margin:12px auto 0;

    color:#777777;

    font-size:11px;

    line-height:1.7;
}

/* ROUTE VISUAL */

.route-area{
    position:relative;

    width:100%;

    height:280px;

    margin-top:25px;

    overflow:hidden;

    border-radius:24px;

    background:
        radial-gradient(
            circle at center,
            #fafafa 0,
            #ffffff 65%
        );
}

/* DOT GRID */

.route-area::before{
    content:"";

    position:absolute;

    inset:0;

    background-image:
        radial-gradient(
            #e4e4e4 1px,
            transparent 1px
        );

    background-size:22px 22px;

    opacity:.55;
}

/* ROUTE LINE */

.route-line{
    position:absolute;

    width:230px;
    height:170px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(-7deg);

    border-left:2px solid #000000;

    border-bottom:2px solid #000000;

    border-radius:0 0 0 100px;

    opacity:.9;
}

/* MOVING DOT */

.route-line::after{
    content:"";

    position:absolute;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#000000;

    left:-5px;

    top:30px;

    box-shadow:
        0 0 0 5px rgba(0,0,0,.06);

    animation:
        routeMove 3s
        ease-in-out
        infinite;
}

@keyframes routeMove{

    0%{
        top:30px;
    }

    50%{
        top:105px;
    }

    100%{
        top:30px;
    }

}

/* LOCATION PIN */

.location-pin{
    position:absolute;

    width:52px;
    height:52px;

    border-radius:50%;

    background:#000000;

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.16);

    z-index:3;
}

.location-pin::after{
    content:"";

    position:absolute;

    width:70px;
    height:70px;

    border-radius:50%;

    border:1px solid #dddddd;

    animation:
        pulse 2.2s
        ease-out
        infinite;
}

@keyframes pulse{

    0%{
        transform:scale(.7);
        opacity:.8;
    }

    100%{
        transform:scale(1.35);
        opacity:0;
    }

}

.location-pin svg{
    width:23px;
    height:23px;
}

.location-pin path{
    fill:none;

    stroke:#ffffff;

    stroke-width:1.7;

    stroke-linecap:round;

    stroke-linejoin:round;
}

/* START PIN */

.start-pin{
    left:17%;
    top:31%;
}

/* END PIN */

.end-pin{
    right:17%;
    bottom:27%;
}

/* PIN LABEL */

.pin-label{
    position:absolute;

    top:58px;

    left:50%;

    transform:
        translateX(-50%);

    white-space:nowrap;

    background:#ffffff;

    border:1px solid #e5e5e5;

    padding:6px 9px;

    border-radius:8px;

    font-size:9px;

    font-weight:700;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.05);
}

/* INFO CARDS */

.quick-info{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:9px;

    margin-top:5px;
}

.info-card{
    min-height:72px;

    border:1px solid #e9e9e9;

    border-radius:14px;

    padding:12px;

    background:#ffffff;
}

.info-number{
    font-size:17px;

    font-weight:800;
}

.info-label{
    margin-top:5px;

    color:#888888;

    font-size:9px;

    line-height:1.4;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;

    left:50%;
    bottom:12px;

    transform:translateX(-50%);

    width:calc(100% - 24px);

    max-width:680px;

    height:70px;

    background:#ffffff;

    border:1px solid #e6e6e6;

    border-radius:20px;

    box-shadow:
        0 12px 40px
        rgba(0,0,0,.10);

    display:grid;

    grid-template-columns:
        1fr 1fr 1fr;

    align-items:center;

    z-index:100;
}

.nav-item{
    height:100%;

    border:0;

    background:transparent;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:5px;

    color:#777777;

    font-family:"Inter",sans-serif;

    font-size:9px;

    font-weight:600;

    cursor:pointer;
}

.nav-item svg{
    width:19px;
    height:19px;
}

.nav-item path{
    fill:none;

    stroke:currentColor;

    stroke-width:1.7;

    stroke-linecap:round;

    stroke-linejoin:round;
}

/* CENTER LOCATION BUTTON */

.location-button-wrap{
    position:relative;

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;
}

.location-button{
    width:52px;
    height:52px;

    border:0;

    border-radius:17px;

    background:#000000;

    color:#ffffff;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.18);

    transition:
        transform .2s ease;
}

.location-button:active{
    transform:scale(.92);
}

.location-button svg{
    width:23px;
    height:23px;
}

.location-button path{
    fill:none;

    stroke:#ffffff;

    stroke-width:1.7;

    stroke-linecap:round;

    stroke-linejoin:round;
}

/* TOAST */

.toast{
    position:fixed;

    left:50%;

    bottom:95px;

    transform:
        translate(-50%,20px);

    background:#000000;

    color:#ffffff;

    padding:11px 16px;

    border-radius:10px;

    font-size:10px;

    font-weight:600;

    opacity:0;

    pointer-events:none;

    transition:.3s ease;

    z-index:200;

    white-space:nowrap;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}


/* DESKTOP */

@media(min-width:700px){

    .main{
        padding-top:55px;
    }

    .hero-title{
        font-size:38px;
    }

    .route-area{
        height:330px;
    }

}

</style>

</head>

<body>

<header class="header">

    <button
        class="header-btn"
        onclick="toggleMenu()"
        aria-label="Menu"
    >

        <svg
            viewBox="0 0 24 24"
            fill="none"
        >

            <path d="M4 7H20"></path>

            <path d="M4 12H20"></path>

            <path d="M4 17H20"></path>

        </svg>

    </button>


    <div class="header-title">
        VRS ROUTE GUIDER
    </div>


    <button
        class="header-btn"
        onclick="profileAction()"
        aria-label="Profile"
    >

        <svg
            viewBox="0 0 24 24"
            fill="none"
        >

            <path
                d="
                M20 21
                C20 17.7
                16.4 15
                12 15
                C7.6 15
                4 17.7
                4 21
                "
            ></path>

            <path
                d="
                M16 7
                C16 9.2
                14.2 11
                12 11
                C9.8 11
                8 9.2
                8 7
                C8 4.8
                9.8 3
                12 3
                C14.2 3
                16 4.8
                16 7Z
                "
            ></path>

        </svg>

    </button>

</header>


<main class="main">

    <section class="hero">

        <div class="hero-small">
            SMART PUBLIC TRANSPORT
        </div>

        <h1 class="hero-title">
            Find your route.<br>
            Reach your destination.
        </h1>

        <p class="hero-description">
            Discover nearby public transport
            and get directions from your
            current location.
        </p>

    </section>


    <section class="route-area">

        <div class="route-line"></div>


        <div class="location-pin start-pin">

            <svg
                viewBox="0 0 24 24"
                fill="none"
            >

                <path
                    d="
                    M20 11
                    C20 16.5 12 22 12 22
                    C12 22 4 16.5 4 11
                    C4 6.6 7.6 3 12 3
                    C16.4 3 20 6.6 20 11Z
                    "
                ></path>

                <path
                    d="
                    M15 11
                    C15 12.7 13.7 14 12 14
                    C10.3 14 9 12.7 9 11
                    C9 9.3 10.3 8 12 8
                    C13.7 8 15 9.3 15 11Z
                    "
                ></path>

            </svg>


            <span class="pin-label">
                START
            </span>

        </div>


        <div class="location-pin end-pin">

            <svg
                viewBox="0 0 24 24"
                fill="none"
            >

                <path
                    d="
                    M20 11
                    C20 16.5 12 22 12 22
                    C12 22 4 16.5 4 11
                    C4 6.6 7.6 3 12 3
                    C16.4 3 20 6.6 20 11Z
                    "
                ></path>

                <path
                    d="
                    M8 11
                    H16
                    M12 7
                    L16 11
                    L12 15
                    "
                ></path>

            </svg>


            <span class="pin-label">
                DESTINATION
            </span>

        </div>

    </section>


    <section class="quick-info">

        <div class="info-card">

            <div
                class="info-number"
                id="transportCount"
            >
                —
            </div>

            <div class="info-label">
                Nearby transport
            </div>

        </div>


        <div class="info-card">

            <div class="info-number">
                GPS
            </div>

            <div class="info-label">
                Live location
            </div>

        </div>


        <div class="info-card">

            <div class="info-number">
                MAPS
            </div>

            <div class="info-label">
                Easy directions
            </div>

        </div>

    </section>

</main>


<nav class="bottom-nav">

    <button
        class="nav-item"
        onclick="routeAction()"
    >

        <svg
            viewBox="0 0 24 24"
            fill="none"
        >

            <path
                d="
                M5 19
                L19 5
                "
            ></path>

            <path
                d="
                M9 5
                H19
                V15
                "
            ></path>

        </svg>

        <span>
            Route
        </span>

    </button>


    <div class="location-button-wrap">

        <button
            class="location-button"
            onclick="getLocation()"
            aria-label="Current location"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
            >

                <path
                    d="
                    M20 11
                    C20 16.5 12 22 12 22
                    C12 22 4 16.5 4 11
                    C4 6.6 7.6 3 12 3
                    C16.4 3 20 6.6 20 11Z
                    "
                ></path>

                <path
                    d="
                    M15 11
                    C15 12.7 13.7 14 12 14
                    C10.3 14 9 12.7 9 11
                    C9 9.3 10.3 8 12 8
                    C13.7 8 15 9.3 15 11Z
                    "
                ></path>

            </svg>

        </button>

    </div>


    <button
        class="nav-item"
        onclick="openMaps()"
    >

        <svg
            viewBox="0 0 24 24"
            fill="none"
        >

            <path
                d="
                M4 6
                L9 4
                L15 6
                L20 4
                V18
                L15 20
                L9 18
                L4 20
                Z
                "
            ></path>

            <path
                d="M9 4V18"></path>

            <path
                d="M15 6V20"></path>

        </svg>

        <span>
            Maps
        </span>

    </button>

</nav>


<div
    class="toast"
    id="toast"
></div>
<script>

function getLocation(){

    showToast(
        "Getting your location..."
    );


    if(
        !navigator.geolocation
    ){

        showToast(
            "Location is not supported"
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position){

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;


            window.location.href =

                "result-nearby.html"

                +

                "?lat="

                +

                encodeURIComponent(
                    latitude
                )

                +

                "&lng="

                +

                encodeURIComponent(
                    longitude
                );

        },


        function(error){

            if(
                error.code === 1
            ){

                showToast(
                    "Please allow location access"
                );

            }

            else if(
                error.code === 2
            ){

                showToast(
                    "Location could not be detected"
                );

            }

            else if(
                error.code === 3
            ){

                showToast(
                    "Location request timed out"
                );

            }

            else{

                showToast(
                    "Unable to get location"
                );

            }

        },


        {
            enableHighAccuracy:true,

            timeout:15000,

            maximumAge:0
        }

    );

}



function openMaps(){

    window.open(
        "https://www.google.com/maps/",
        "_blank"
    );

}



function routeAction(){

    getLocation();

}



function profileAction(){

    showToast(
        "Profile feature coming soon"
    );

}



function toggleMenu(){

    showToast(
        "Menu feature coming soon"
    );

}



function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}


</script>

</body>

</html>
