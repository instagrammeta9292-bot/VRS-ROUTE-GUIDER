<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>VRS Route Guider</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

/* ================================
   RESET
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#ffffff;
    color:#000000;
    font-family:"Inter",sans-serif;
    overflow-x:hidden;
}


/* ================================
   HEADER
================================ */

.header{

    width:100%;
    height:70px;

    display:flex;
    align-items:center;

    padding:0 16px;

    background:#ffffff;

    border-bottom:1px solid #ededed;

    position:relative;

    z-index:20;
}


/* ================================
   MENU
================================ */

.menu-btn{

    width:40px;
    height:40px;

    border:0;
    border-radius:12px;

    background:#f5f5f5;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:5px;

    cursor:pointer;

    transition:.2s ease;
}

.menu-btn span{

    width:18px;
    height:2px;

    background:#000000;

    border-radius:10px;
}

.menu-btn:active{

    transform:scale(.94);
}


/* ================================
   BRAND
================================ */

.brand{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    display:flex;
    flex-direction:column;

    align-items:center;

    white-space:nowrap;
}

.brand-title{

    font-size:15px;

    font-weight:800;

    letter-spacing:.8px;

    line-height:1;

    color:#000000;
}


/* ================================
   SMALL ROUTE
================================ */

.title-route{

    width:105px;
    height:23px;

    margin-top:6px;
}

.title-route svg{

    width:100%;
    height:100%;

    overflow:visible;
}

.route-base{

    fill:none;

    stroke:#d5d5d5;

    stroke-width:1.5;

    stroke-linecap:round;

    stroke-dasharray:4 5;
}

.route-moving{

    fill:none;

    stroke:#000000;

    stroke-width:2;

    stroke-linecap:round;

    stroke-dasharray:18 100;

    stroke-dashoffset:118;

    animation:routeMove 2.6s ease-in-out infinite;
}

@keyframes routeMove{

    0%{
        stroke-dashoffset:118;
        opacity:0;
    }

    15%{
        opacity:1;
    }

    75%{
        opacity:1;
    }

    100%{
        stroke-dashoffset:0;
        opacity:0;
    }
}

.pin{

    fill:#ffffff;

    stroke:#000000;

    stroke-width:1.8;
}

.pin-dot{

    fill:#000000;
}


/* ================================
   PROFILE
================================ */

.profile-btn{

    width:40px;
    height:40px;

    margin-left:auto;

    border:1px solid #dddddd;

    border-radius:50%;

    background:#ffffff;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:.2s ease;
}

.profile-btn:active{

    transform:scale(.94);
}

.profile-svg{

    width:21px;
    height:21px;
}


/* ================================
   MAIN
================================ */

.main{

    width:100%;

    min-height:calc(100vh - 70px);

    display:flex;

    align-items:center;
    justify-content:center;

    padding:20px 20px 120px;
}


/* ================================
   ROUTE DISPLAY
================================ */

.route-display{

    width:100%;

    max-width:430px;

    display:flex;

    align-items:center;
    justify-content:center;
}

.large-route{

    width:260px;
    height:135px;
}

.large-route svg{

    width:100%;
    height:100%;

    overflow:visible;
}

.large-route-base{

    fill:none;

    stroke:#dddddd;

    stroke-width:2;

    stroke-linecap:round;

    stroke-dasharray:6 8;
}

.large-route-moving{

    fill:none;

    stroke:#000000;

    stroke-width:3;

    stroke-linecap:round;

    stroke-dasharray:35 190;

    stroke-dashoffset:225;

    animation:largeRouteMove 3s ease-in-out infinite;
}

@keyframes largeRouteMove{

    0%{
        stroke-dashoffset:225;
        opacity:0;
    }

    12%{
        opacity:1;
    }

    72%{
        opacity:1;
    }

    100%{
        stroke-dashoffset:0;
        opacity:0;
    }
}


/* ================================
   BOTTOM BAR
================================ */

.bottom-bar{

    position:fixed;

    left:50%;
    bottom:10px;

    transform:translateX(-50%);

    width:calc(100% - 20px);

    max-width:470px;

    height:68px;

    background:#ffffff;

    border:1px solid #e6e6e6;

    border-radius:20px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.08);

    display:grid;

    grid-template-columns:1fr 1fr 1fr;

    align-items:center;

    z-index:100;
}


/* ================================
   NAV ITEM
================================ */

.nav-item{

    height:100%;

    border:0;

    background:transparent;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:5px;

    color:#666666;

    font-family:"Inter",sans-serif;

    cursor:pointer;

    transition:.2s ease;
}

.nav-item:active{

    transform:scale(.94);
}

.nav-label{

    font-size:10px;

    font-weight:600;
}


/* ================================
   ROUTE ICON
================================ */

.nav-icon{

    width:22px;
    height:22px;
}

.route-icon path{

    fill:none;

    stroke:currentColor;

    stroke-width:1.8;

    stroke-linecap:round;

    stroke-linejoin:round;
}

.route-icon circle{

    fill:#ffffff;

    stroke:currentColor;

    stroke-width:1.8;
}


/* ================================
   LOCATION BUTTON
================================ */

.location-nav{

    width:50px;
    height:50px;

    border-radius:17px;

    border:0;

    background:#000000;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    box-shadow:
        0 7px 18px rgba(0,0,0,.16);

    transition:.2s ease;
}

.location-nav:active{

    transform:scale(.93);
}

.location-svg{

    width:23px;
    height:23px;
}

.location-svg path{

    fill:none;

    stroke:#ffffff;

    stroke-width:1.8;

    stroke-linecap:round;

    stroke-linejoin:round;
}

.location-svg circle{

    fill:#ffffff;
}


/* ================================
   MAP ICON
================================ */

.map-icon path{

    fill:none;

    stroke:currentColor;

    stroke-width:1.7;

    stroke-linejoin:round;
}

.map-icon line{

    stroke:currentColor;

    stroke-width:1.5;
}


/* ================================
   TOAST
================================ */

.toast{

    position:fixed;

    left:50%;
    bottom:95px;

    transform:translate(-50%,20px);

    background:#000000;

    color:#ffffff;

    padding:11px 16px;

    border-radius:10px;

    font-size:10px;

    font-weight:600;

    opacity:0;

    pointer-events:none;

    transition:.3s ease;

    z-index:200;

    white-space:nowrap;
}

.toast.show{

    opacity:1;

    transform:translate(-50%,0);
}


/* ================================
   SMALL SCREEN
================================ */

@media(max-width:350px){

    .brand-title{

        font-size:14px;

        letter-spacing:.5px;
    }

    .title-route{

        width:94px;
    }

    .large-route{

        width:230px;
    }

}

</style>

</head>


<body>


<!-- ================================
     HEADER
================================ -->

<header class="header">


    <!-- MENU -->

    <button
        class="menu-btn"
        onclick="openMenu()"
        aria-label="Menu"
    >

        <span></span>
        <span></span>
        <span></span>

    </button>


    <!-- BRAND -->

    <div class="brand">

        <div class="brand-title">
            VRS ROUTE GUIDER
        </div>


        <div class="title-route">

            <svg
                viewBox="0 0 118 24"
                xmlns="http://www.w3.org/2000/svg"
            >

                <path
                    class="pin"
                    d="
                    M7 5
                    C7 2.8 8.8 1 11 1
                    C13.2 1 15 2.8 15 5
                    C15 8.2 11 11.5 11 11.5
                    C11 11.5 7 8.2 7 5Z
                    "
                />

                <circle
                    class="pin-dot"
                    cx="11"
                    cy="5"
                    r="1.6"
                />

                <path
                    class="route-base"
                    d="
                    M15 8
                    C33 20 44 3 60 12
                    C76 21 88 6 102 8
                    "
                />

                <path
                    class="route-moving"
                    d="
                    M15 8
                    C33 20 44 3 60 12
                    C76 21 88 6 102 8
                    "
                />

                <path
                    class="pin"
                    d="
                    M102 5
                    C102 2.8 103.8 1 106 1
                    C108.2 1 110 2.8 110 5
                    C110 8.2 106 11.5 106 11.5
                    C106 11.5 102 8.2 102 5Z
                    "
                />

                <circle
                    class="pin-dot"
                    cx="106"
                    cy="5"
                    r="1.6"
                />

            </svg>

        </div>

    </div>


    <!-- PROFILE -->

    <button
        class="profile-btn"
        onclick="openProfile()"
        aria-label="Profile"
    >

        <svg
            class="profile-svg"
            viewBox="0 0 24 24"
            fill="none"
        >

            <circle
                cx="12"
                cy="8"
                r="3.2"
                fill="#000000"
            />

            <path
                d="
                M5.5 20
                C6.2 15.8 8.3 13.7 12 13.7
                C15.7 13.7 17.8 15.8 18.5 20
                "
                stroke="#000000"
                stroke-width="2"
                stroke-linecap="round"
            />

        </svg>

    </button>

</header>



<!-- ================================
     MAIN
================================ -->

<main class="main">

    <div class="route-display">

        <div class="large-route">

            <svg
                viewBox="0 0 290 150"
                xmlns="http://www.w3.org/2000/svg"
            >

                <!-- START -->

                <path
                    class="pin"
                    d="
                    M25 38
                    C25 31 30.5 25.5 37.5 25.5
                    C44.5 25.5 50 31 50 38
                    C50 48 37.5 62 37.5 62
                    C37.5 62 25 48 25 38Z
                    "
                />

                <circle
                    class="pin-dot"
                    cx="37.5"
                    cy="38"
                    r="4"
                />


                <!-- BASE ROUTE -->

                <path
                    class="large-route-base"
                    d="
                    M50 48
                    C82 90 101 30 135 68
                    C163 98 189 42 230 66
                    "
                />


                <!-- MOVING ROUTE -->

                <path
                    class="large-route-moving"
                    d="
                    M50 48
                    C82 90 101 30 135 68
                    C163 98 189 42 230 66
                    "
                />


                <!-- DESTINATION -->

                <path
                    class="pin"
                    d="
                    M217 38
                    C217 31 222.5 25.5 229.5 25.5
                    C236.5 25.5 242 31 242 38
                    C242 48 229.5 62 229.5 62
                    C229.5 62 217 48 217 38Z
                    "
                />

                <circle
                    class="pin-dot"
                    cx="229.5"
                    cy="38"
                    r="4"
                />

            </svg>

        </div>

    </div>

</main>



<!-- ================================
     BOTTOM NAVIGATION
================================ -->

<nav class="bottom-bar">


    <!-- ROUTE -->

    <button
        class="nav-item"
        onclick="openRoute()"
    >

        <svg
            class="nav-icon route-icon"
            viewBox="0 0 24 24"
            fill="none"
        >

            <path
                d="
                M5 18
                C7 14 8 10 11 11
                C14 12 14 17 17 15
                C19 14 19 10 19 7
                "
            />

            <circle
                cx="5"
                cy="18"
                r="2.5"
            />

            <circle
                cx="19"
                cy="7"
                r="2.5"
            />

        </svg>


        <span class="nav-label">
            Route
        </span>

    </button>



    <!-- LOCATION -->

    <button
        class="nav-item"
        onclick="requestLocation()"
    >

        <div
            class="location-nav"
            id="locationButton"
        >

            <svg
                class="location-svg"
                viewBox="0 0 24 24"
                fill="none"
            >

                <path
                    d="
                    M20 11
                    C20 16.5 12 22 12 22
                    C12 22 4 16.5 4 11
                    C4 6.6 7.6 3 12 3
                    C16.4 3 20 6.6 20 11Z
                    "
                />

                <circle
                    cx="12"
                    cy="11"
                    r="3"
                />

            </svg>

        </div>

        <span class="nav-label">
            Location
        </span>

    </button>



    <!-- MAPS -->

    <button
        class="nav-item"
        onclick="openMaps()"
    >

        <svg
            class="nav-icon map-icon"
            viewBox="0 0 24 24"
            fill="none"
        >

            <path
                d="
                M3 6
                L8 3
                L16 6
                L21 3
                V18
                L16 21
                L8 18
                L3 21
                Z
                "
            />

            <line
                x1="8"
                y1="3"
                x2="8"
                y2="18"
            />

            <line
                x1="16"
                y1="6"
                x2="16"
                y2="21"
            />

        </svg>


        <span class="nav-label">
            Maps
        </span>

    </button>

</nav>



<!-- TOAST -->

<div
    class="toast"
    id="toast"
></div>



<script>

/* ================================
   MENU
================================ */

function openMenu(){

    showToast("Menu opened");

}


/* ================================
   PROFILE
================================ */

function openProfile(){

    showToast("Profile");

}


/* ================================
   ROUTE
================================ */

function openRoute(){

    showToast("Route planner");

}


/* ================================
   MAPS
================================ */

function openMaps(){

    window.open(
        "https://www.google.com/maps",
        "_blank"
    );

}


/* ================================
   LOCATION
================================ */

function requestLocation(){

    if(!navigator.geolocation){

        showToast(
            "Location is not supported"
        );

        return;

    }


    const button =
        document.getElementById(
            "locationButton"
        );


    button.innerHTML = `

        <svg
            class="location-svg"
            viewBox="0 0 24 24"
            fill="none"
        >

            <path
                d="
                M20 11
                C20 16.5 12 22 12 22
                C12 22 4 16.5 4 11
                C4 6.6 7.6 3 12 3
                C16.4 3 20 6.6 20 11Z
                "
            />

            <circle
                cx="12"
                cy="11"
                r="3"
            />

        </svg>

    `;


    navigator.geolocation.getCurrentPosition(

        function(position){

            /*
             * Location has successfully been obtained.
             * Now open the nearby-results page.
             */

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;


            /*
             * Pass coordinates to result-nearby.html.
             */

            window.location.href =
                "result-nearby.html"
                +
                "?lat="
                +
                encodeURIComponent(latitude)
                +
                "&lng="
                +
                encodeURIComponent(longitude);

        },


        function(error){

            button.innerHTML = `

                <svg
                    class="location-svg"
                    viewBox="0 0 24 24"
                    fill="none"
                >

                    <path
                        d="
                        M20 11
                        C20 16.5 12 22 12 22
                        C12 22 4 16.5 4 11
                        C4 6.6 7.6 3 12 3
                        C16.4 3 20 6.6 20 11Z
                        "
                    />

                    <circle
                        cx="12"
                        cy="11"
                        r="3"
                    />

                </svg>

            `;


            if(error.code === 1){

                showToast(
                    "Location permission denied"
                );

            }
            else{

                showToast(
                    "Unable to get your location"
                );

            }

        },


        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }

    );

}


/* ================================
   TOAST
================================ */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(

        function(){

            toast.classList.remove(
                "show"
            );

        },

        1800

    );

}

</script>


</body>
  </html>
