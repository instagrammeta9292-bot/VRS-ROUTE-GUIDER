<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Nearby Transport</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

/* ================================
   RESET
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#ffffff;
    color:#000000;
    font-family:"Inter",sans-serif;
    overflow-x:hidden;
}


/* ================================
   HEADER
================================ */

.header{
    width:100%;
    height:70px;

    display:flex;
    align-items:center;

    padding:0 18px;

    background:#ffffff;

    border-bottom:1px solid #ededed;

    position:sticky;
    top:0;

    z-index:50;
}


/* ================================
   BACK BUTTON
================================ */

.back-btn{
    width:40px;
    height:40px;

    border:0;
    border-radius:12px;

    background:#f5f5f5;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.back-btn svg{
    width:20px;
    height:20px;
}

.back-btn path{
    fill:none;
    stroke:#000000;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}


/* ================================
   HEADER TITLE
================================ */

.header-title{
    position:absolute;

    left:50%;

    transform:translateX(-50%);

    font-size:15px;
    font-weight:800;

    letter-spacing:.7px;

    white-space:nowrap;
}


/* ================================
   MAIN
================================ */

.main{
    width:100%;
    max-width:700px;

    margin:auto;

    padding:27px 18px 45px;
}


/* ================================
   INTRO
================================ */

.page-intro{
    margin-bottom:21px;
}

.page-title{
    font-size:25px;

    line-height:1.2;

    font-weight:800;

    letter-spacing:-.6px;
}

.page-subtitle{
    margin-top:8px;

    color:#777777;

    font-size:12px;

    line-height:1.6;
}


/* ================================
   CURRENT LOCATION CARD
================================ */

.location-card{
    width:100%;

    padding:16px;

    border:1px solid #e7e7e7;

    border-radius:16px;

    background:#ffffff;

    display:flex;
    align-items:center;

    gap:13px;

    margin-bottom:25px;
}

.current-location-icon{
    width:40px;
    height:40px;

    flex-shrink:0;

    border-radius:12px;

    background:#000000;

    display:flex;
    align-items:center;
    justify-content:center;
}

.current-location-icon svg{
    width:20px;
    height:20px;
}

.current-location-icon path{
    fill:none;

    stroke:#ffffff;

    stroke-width:1.8;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.current-location-icon circle{
    fill:#ffffff;
}

.location-info{
    min-width:0;
}

.location-label{
    font-size:9px;

    color:#888888;

    font-weight:700;

    letter-spacing:.4px;

    margin-bottom:4px;
}

.location-value{
    font-size:12px;

    font-weight:600;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* ================================
   SECTION HEADER
================================ */

.section-head{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:13px;
}

.section-title{
    font-size:14px;

    font-weight:800;
}

.result-count{
    color:#888888;

    font-size:10px;
}


/* ================================
   FILTERS
================================ */

.filters{
    display:flex;

    gap:8px;

    overflow-x:auto;

    padding-bottom:4px;

    margin-bottom:19px;

    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter-btn{
    flex-shrink:0;

    height:34px;

    padding:0 14px;

    border:1px solid #dddddd;

    border-radius:10px;

    background:#ffffff;

    color:#555555;

    font-family:"Inter",sans-serif;

    font-size:10px;

    font-weight:600;

    cursor:pointer;
}

.filter-btn.active{
    background:#000000;

    color:#ffffff;

    border-color:#000000;
}


/* ================================
   RESULTS CONTAINER
================================ */

.results{
    display:flex;

    flex-direction:column;

    gap:10px;
}


/* ================================
   TRANSPORT CARD
================================ */

.transport-card{
    width:100%;

    min-height:88px;

    padding:15px;

    border:1px solid #e8e8e8;

    border-radius:15px;

    background:#ffffff;

    display:flex;

    align-items:center;

    gap:13px;

    transition:.2s ease;
}

.transport-card:active{
    transform:scale(.99);
}


/* ================================
   TRANSPORT ICON
================================ */

.transport-icon{
    width:43px;
    height:43px;

    flex-shrink:0;

    border-radius:12px;

    background:#f4f4f4;

    display:flex;

    align-items:center;
    justify-content:center;
}

.transport-icon svg{
    width:21px;
    height:21px;
}

.transport-icon path{
    fill:none;

    stroke:#000000;

    stroke-width:1.7;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.transport-icon rect{
    fill:none;

    stroke:#000000;

    stroke-width:1.7;
}

.transport-icon circle{
    fill:none;

    stroke:#000000;

    stroke-width:1.7;
}


/* ================================
   TRANSPORT INFO
================================ */

.transport-info{
    flex:1;

    min-width:0;
}

.transport-name{
    font-size:13px;

    font-weight:700;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.transport-type{
    margin-top:5px;

    font-size:10px;

    color:#888888;
}

.transport-distance{
    margin-top:5px;

    font-size:10px;

    color:#555555;
}


/* ================================
   DIRECTIONS BUTTON
================================ */

.direction-btn{
    width:36px;
    height:36px;

    flex-shrink:0;

    border:0;

    border-radius:11px;

    background:#000000;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.direction-btn svg{
    width:17px;
    height:17px;
}

.direction-btn path{
    fill:none;

    stroke:#ffffff;

    stroke-width:1.7;

    stroke-linecap:round;
    stroke-linejoin:round;
}


/* ================================
   LOADING
================================ */

.loading{
    padding:45px 20px;

    text-align:center;
}

.loading-circle{
    width:30px;
    height:30px;

    margin:0 auto 15px;

    border:2px solid #e5e5e5;

    border-top-color:#000000;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.loading-title{
    font-size:13px;

    font-weight:700;
}

.loading-text{
    margin-top:6px;

    color:#888888;

    font-size:10px;
}


/* ================================
   MESSAGE
================================ */

.message{
    text-align:center;

    padding:40px 20px;

    border:1px solid #eeeeee;

    border-radius:16px;
}

.message-title{
    font-size:14px;

    font-weight:700;
}

.message-text{
    margin-top:7px;

    font-size:11px;

    color:#888888;

    line-height:1.6;
}

.retry-btn{
    margin-top:17px;

    height:38px;

    padding:0 18px;

    border:0;

    border-radius:11px;

    background:#000000;

    color:#ffffff;

    font-family:"Inter",sans-serif;

    font-size:11px;

    font-weight:600;

    cursor:pointer;
}


/* ================================
   TOAST
================================ */

.toast{
    position:fixed;

    left:50%;

    bottom:22px;

    transform:translate(-50%,20px);

    background:#000000;

    color:#ffffff;

    padding:11px 16px;

    border-radius:10px;

    font-size:10px;

    font-weight:600;

    opacity:0;

    pointer-events:none;

    transition:.3s ease;

    z-index:100;

    white-space:nowrap;
}

.toast.show{
    opacity:1;

    transform:translate(-50%,0);
}


/* ================================
   DESKTOP
================================ */

@media(min-width:700px){

    .main{
        padding-top:40px;
    }

    .page-title{
        font-size:29px;
    }

}

</style>

</head>

<body>

<!-- HEADER -->

<header class="header">

    <button
        class="back-btn"
        onclick="goBack()"
        aria-label="Back"
    >

        <svg
            viewBox="0 0 24 24"
            fill="none"
        >

            <path
                d="
                M19 12
                H5
                M11 6
                L5 12
                L11 18
                "
            />

        </svg>

    </button>


    <div class="header-title">
        VRS ROUTE GUIDER
    </div>

</header>


<!-- MAIN -->

<main class="main">

    <!-- INTRO -->

    <section class="page-intro">

        <h1 class="page-title">
            Nearby Transport
        </h1>

        <p class="page-subtitle">
            Find nearby buses, metro stations
            and railway stations from your current location.
        </p>

    </section>


    <!-- CURRENT LOCATION -->

    <section class="location-card">

        <div class="current-location-icon">

            <svg
                viewBox="0 0 24 24"
                fill="none"
            >

                <path
                    d="
                    M20 11
                    C20 16.5 12 22 12 22
                    C12 22 4 16.5 4 11
                    C4 6.6 7.6 3 12 3
                    C16.4 3 20 6.6 20 11Z
                    "
                />

                <circle
                    cx="12"
                    cy="11"
                    r="3"
                />

            </svg>

        </div>


        <div class="location-info">

            <div class="location-label">
                YOUR CURRENT LOCATION
            </div>

            <div
                class="location-value"
                id="locationText"
            >
                Detecting your location...
            </div>

        </div>

    </section>


    <!-- SECTION HEADER -->

    <div class="section-head">

        <div class="section-title">
            Nearby places
        </div>

        <div
            class="result-count"
            id="resultCount"
        >
            Searching...
        </div>

    </div>


    <!-- FILTERS -->

    <div class="filters">

        <button
            class="filter-btn active"
            onclick="filterResults('all',this)"
        >
            All
        </button>

        <button
            class="filter-btn"
            onclick="filterResults('bus',this)"
        >
            Bus
        </button>

        <button
            class="filter-btn"
            onclick="filterResults('metro',this)"
        >
            Metro
        </button>

        <button
            class="filter-btn"
            onclick="filterResults('railway',this)"
        >
            Railway
        </button>

    </div>


    <!-- RESULTS -->

    <section
        class="results"
        id="results"
    >

        <div class="loading">

            <div class="loading-circle"></div>

            <div class="loading-title">
                Finding nearby transport
            </div>

            <div class="loading-text">
                Getting your location...
            </div>

        </div>

    </section>

</main>


<!-- TOAST -->

<div
    class="toast"
    id="toast"
></div>
<script>

let userLatitude = null;
let userLongitude = null;

let allPlaces = [];

let currentFilter = "all";


window.addEventListener(
    "load",
    startPage
);


function startPage(){

    const params =
        new URLSearchParams(
            window.location.search
        );


    const lat =
        parseFloat(
            params.get("lat")
        );


    const lng =
        parseFloat(
            params.get("lng")
        );


    if(
        Number.isFinite(lat)
        &&
        Number.isFinite(lng)
    ){

        userLatitude = lat;

        userLongitude = lng;

        showLocation();

        findNearbyTransport();

    }

    else{

        getCurrentLocation();

    }

}



function getCurrentLocation(){

    if(
        !navigator.geolocation
    ){

        showError(
            "Your browser does not support location."
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position){

            userLatitude =
                position.coords.latitude;

            userLongitude =
                position.coords.longitude;


            showLocation();

            findNearbyTransport();

        },


        function(error){

            if(
                error.code === 1
            ){

                showError(
                    "Location permission was denied. Please allow location access and try again."
                );

            }

            else if(
                error.code === 2
            ){

                showError(
                    "Your current location could not be detected."
                );

            }

            else if(
                error.code === 3
            ){

                showError(
                    "Location request timed out. Please try again."
                );

            }

            else{

                showError(
                    "Unable to access your location."
                );

            }

        },


        {
            enableHighAccuracy:true,

            timeout:15000,

            maximumAge:0
        }

    );

}



function showLocation(){

    document.getElementById(
        "locationText"
    ).textContent =

        userLatitude.toFixed(5)

        +

        ", "

        +

        userLongitude.toFixed(5);

}



async function findNearbyTransport(){

    const results =
        document.getElementById(
            "results"
        );


    results.innerHTML = `

        <div class="loading">

            <div class="loading-circle"></div>

            <div class="loading-title">
                Searching nearby transport
            </div>

            <div class="loading-text">
                Looking within approximately 5 km...
            </div>

        </div>

    `;


    const query = `

        [out:json][timeout:30];

        (

            node["highway"="bus_stop"]
                (around:5000,${userLatitude},${userLongitude});

            node["public_transport"="platform"]
                (around:5000,${userLatitude},${userLongitude});

            node["railway"="station"]
                (around:5000,${userLatitude},${userLongitude});

            node["railway"="halt"]
                (around:5000,${userLatitude},${userLongitude});

            node["railway"="subway_entrance"]
                (around:5000,${userLatitude},${userLongitude});

            node["station"="subway"]
                (around:5000,${userLatitude},${userLongitude});

            way["highway"="bus_stop"]
                (around:5000,${userLatitude},${userLongitude});

            way["railway"="station"]
                (around:5000,${userLatitude},${userLongitude});

        );

        out center tags;

    `;


    try{

        const response =
            await fetch(
                "https://overpass-api.de/api/interpreter",
                {
                    method:"POST",

                    body:query
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "API request failed"
            );

        }


        const data =
            await response.json();


        processResults(
            data.elements
        );

    }


    catch(error){

        console.error(
            error
        );


        showError(
            "Unable to load nearby transport. Please check your internet connection and try again."
        );

    }

}



function processResults(
    elements
){

    allPlaces = [];


    elements.forEach(
        function(item){

            const tags =
                item.tags || {};


            let lat =
                item.lat;


            let lon =
                item.lon;


            if(
                lat === undefined
                &&
                item.center
            ){

                lat =
                    item.center.lat;


                lon =
                    item.center.lon;

            }


            if(
                lat === undefined
                ||
                lon === undefined
            ){

                return;

            }


            const type =
                detectTransportType(
                    tags
                );


            if(!type){

                return;

            }


            const name =

                tags.name

                ||

                tags["name:en"]

                ||

                getDefaultName(
                    type
                );


            const distance =
                calculateDistance(

                    userLatitude,

                    userLongitude,

                    lat,

                    lon

                );


            allPlaces.push({

                name:name,

                type:type,

                latitude:lat,

                longitude:lon,

                distance:distance

            });

        }
    );


    allPlaces =
        removeDuplicates(
            allPlaces
        );


    allPlaces.sort(
        function(a,b){

            return a.distance -
                   b.distance;

        }
    );


    allPlaces =
        allPlaces.slice(
            0,
            50
        );


    document.getElementById(
        "resultCount"
    ).textContent =

        allPlaces.length
        +
        " found";


    displayResults();

}



function detectTransportType(
    tags
){

    if(

        tags.station === "subway"

        ||

        tags.railway ===
        "subway_entrance"

        ||

        tags.subway === "yes"

    ){

        return "metro";

    }


    if(

        tags.railway === "station"

        ||

        tags.railway === "halt"

    ){

        return "railway";

    }


    if(

        tags.highway === "bus_stop"

        ||

        tags.public_transport ===
        "platform"

        ||

        tags.public_transport ===
        "stop_position"

    ){

        return "bus";

    }


    return null;

}



function getDefaultName(
    type
){

    if(
        type === "bus"
    ){

        return "Bus Stop";

    }


    if(
        type === "metro"
    ){

        return "Metro Station";

    }


    return "Railway Station";

}



function displayResults(){

    const container =
        document.getElementById(
            "results"
        );


    let places =
        allPlaces;


    if(
        currentFilter !== "all"
    ){

        places =
            allPlaces.filter(
                function(place){

                    return place.type ===
                        currentFilter;

                }
            );

    }


    if(
        places.length === 0
    ){

        container.innerHTML = `

            <div class="message">

                <div class="message-title">
                    No nearby places found
                </div>

                <div class="message-text">
                    We could not find this type of
                    transport within approximately
                    5 km of your location.
                </div>

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    places.forEach(
        function(place){

            container.innerHTML +=
                createTransportCard(
                    place
                );

        }
    );

}



function createTransportCard(
    place
){

    return `

        <article
            class="transport-card"
        >

            <div class="transport-icon">

                ${getTransportIcon(
                    place.type
                )}

            </div>


            <div class="transport-info">

                <div class="transport-name">

                    ${escapeHTML(
                        place.name
                    )}

                </div>


                <div class="transport-type">

                    ${getTypeName(
                        place.type
                    )}

                </div>


                <div class="transport-distance">

                    ${formatDistance(
                        place.distance
                    )}

                    ·

                    ${getWalkingTime(
                        place.distance
                    )}

                    walk

                </div>

            </div>


            <button
                class="direction-btn"

                onclick="
                    openDirections(
                        ${place.latitude},
                        ${place.longitude}
                    )
                "

                aria-label="Directions"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                >

                    <path
                        d="
                        M5 19
                        L19 5
                        M9 5
                        H19
                        V15
                        "
                    />

                </svg>

            </button>

        </article>

    `;

}
  function getTransportIcon(type){

    if(
        type === "bus"
    ){

        return `

            <svg
                viewBox="0 0 24 24"
                fill="none"
            >

                <rect
                    x="5"
                    y="3"
                    width="14"
                    height="16"
                    rx="2"
                />

                <path
                    d="M5 13H19"
                />

                <path
                    d="M8 7H16"
                />

                <circle
                    cx="8"
                    cy="20"
                    r="1.5"
                />

                <circle
                    cx="16"
                    cy="20"
                    r="1.5"
                />

            </svg>

        `;

    }


    if(
        type === "metro"
    ){

        return `

            <svg
                viewBox="0 0 24 24"
                fill="none"
            >

                <rect
                    x="5"
                    y="3"
                    width="14"
                    height="15"
                    rx="2"
                />

                <path
                    d="M5 12H19"
                />

                <path
                    d="M8 7H16"
                />

                <circle
                    cx="8"
                    cy="20"
                    r="1.5"
                />

                <circle
                    cx="16"
                    cy="20"
                    r="1.5"
                />

            </svg>

        `;

    }


    return `

        <svg
            viewBox="0 0 24 24"
            fill="none"
        >

            <path
                d="
                M4 18
                L9 13
                L13 16
                L20 8
                "
            />

            <path
                d="M4 20H20"
            />

            <path
                d="M6 17V10"
            />

            <path
                d="M10 13V7"
            />

            <path
                d="M14 15V9"
            />

            <path
                d="M18 10V5"
            />

        </svg>

    `;

}



function getTypeName(
    type
){

    if(
        type === "bus"
    ){

        return "Bus Stop";

    }


    if(
        type === "metro"
    ){

        return "Metro Station";

    }


    return "Railway Station";

}



function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371;


    const dLat =
        toRadians(
            lat2 - lat1
        );


    const dLon =
        toRadians(
            lon2 - lon1
        );


    const a =

        Math.sin(
            dLat / 2
        )
        *
        Math.sin(
            dLat / 2
        )

        +

        Math.cos(
            toRadians(lat1)
        )
        *
        Math.cos(
            toRadians(lat2)
        )
        *
        Math.sin(
            dLon / 2
        )
        *
        Math.sin(
            dLon / 2
        );


    const c =

        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return R * c;

}



function toRadians(
    value
){

    return value *
        Math.PI /
        180;

}



function formatDistance(
    km
){

    if(
        km < 1
    ){

        return Math.round(
            km * 1000
        ) + " m";

    }


    return km.toFixed(1)
        +
        " km";

}



function getWalkingTime(
    km
){

    /*
       Approximate walking speed:
       5 km/h = about 12 minutes/km
    */

    const minutes =
        Math.max(
            1,
            Math.round(
                km * 12
            )
        );


    return minutes +
        " min";

}



function filterResults(
    type,
    button
){

    currentFilter =
        type;


    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(
            function(btn){

                btn.classList.remove(
                    "active"
                );

            }
        );


    button.classList.add(
        "active"
    );


    displayResults();

}



function openDirections(
    latitude,
    longitude
){

    const url =

        "https://www.google.com/maps/dir/?api=1"

        +

        "&destination="

        +

        latitude

        +

        ","

        +

        longitude;


    window.open(
        url,
        "_blank"
    );

}



function removeDuplicates(
    places
){

    const result = [];


    places.forEach(
        function(place){

            const exists =
                result.some(
                    function(existing){

                        return (

                            existing.type ===
                            place.type

                            &&

                            Math.abs(
                                existing.latitude -
                                place.latitude
                            ) < 0.0001

                            &&

                            Math.abs(
                                existing.longitude -
                                place.longitude
                            ) < 0.0001

                        );

                    }
                );


            if(
                !exists
            ){

                result.push(
                    place
                );

            }

        }
    );


    return result;

}



function escapeHTML(
    text
){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

  }
  function showError(
    message
){

    document.getElementById(
        "results"
    ).innerHTML = `

        <div class="message">

            <div class="message-title">
                Location Required
            </div>

            <div class="message-text">
                ${escapeHTML(message)}
            </div>

            <button
                class="retry-btn"
                onclick="startPage()"
            >
                Try Again
            </button>

        </div>

    `;


    document.getElementById(
        "resultCount"
    ).textContent =
        "0 found";

}



function goBack(){

    if(

        document.referrer

        &&

        document.referrer !==
        window.location.href

    ){

        history.back();

    }

    else{

        window.location.href =
            "home.html";

    }

}



function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        function(){

            toast.classList.remove(
                "show"
            );

        },
        1800
    );

}

</script>
